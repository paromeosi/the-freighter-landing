<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap');
      .serif { font-family: 'Instrument Serif', 'Times New Roman', serif; font-weight: 400; fill: #1f1810; }
      .serif-it { font-family: 'Instrument Serif', 'Times New Roman', serif; font-weight: 400; font-style: italic; fill: #5b21b6; }
      .sans { font-family: 'Geist', system-ui, -apple-system, sans-serif; font-weight: 500; fill: #1f1810; }
      .sans-2 { font-family: 'Geist', system-ui, -apple-system, sans-serif; font-weight: 400; fill: #59503f; }
      .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-weight: 500; fill: #837a68; letter-spacing: 0.08em; }
      .mono-accent { font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-weight: 500; fill: #5b21b6; letter-spacing: 0.08em; }
    </style>
  </defs>

  <!-- background: warm paper -->
  <rect width="1200" height="630" fill="#f7f4ed"/>

  <!-- subtle hairlines -->
  <line x1="64" y1="120" x2="1136" y2="120" stroke="#d6cfbe" stroke-width="1"/>
  <line x1="64" y1="510" x2="1136" y2="510" stroke="#d6cfbe" stroke-width="1"/>

  <!-- brand mark top-left -->
  <g transform="translate(64, 64)">
    <rect x="0" y="0" width="38" height="38" fill="none" stroke="#1f1810" stroke-width="1.5"/>
    <line x1="8" y1="12" x2="24" y2="12" stroke="#1f1810" stroke-width="1.8"/>
    <line x1="8" y1="19" x2="22" y2="19" stroke="#1f1810" stroke-width="1.8"/>
    <line x1="8" y1="26" x2="20" y2="26" stroke="#1f1810" stroke-width="1.8"/>
    <polygon points="26,14 34,19 26,24" fill="#5b21b6"/>
    <text x="52" y="27" class="serif-it" font-size="22" fill="#1f1810" font-style="italic">The</text>
    <text x="92" y="27" class="sans" font-size="22">Freighter</text>
  </g>

  <!-- coming soon kicker -->
  <g transform="translate(64, 156)">
    <circle cx="6" cy="14" r="5" fill="#5b21b6"/>
    <text x="22" y="19" class="mono" font-size="14">COMING SOON</text>
  </g>

  <!-- H1 headline -->
  <text x="64" y="246" class="serif" font-size="76" letter-spacing="-1.2">Il sistema operativo</text>
  <text x="64" y="328" class="serif" font-size="76" letter-spacing="-1.2">del <tspan class="serif-it" font-style="italic">freight brokerage</tspan></text>
  <text x="64" y="410" class="serif" font-size="76" letter-spacing="-1.2">italiano.</text>

  <!-- lead -->
  <text x="64" y="464" class="sans-2" font-size="22">TMS, pricing intelligente e marketplace vettori</text>
  <text x="64" y="494" class="sans-2" font-size="22">per il trasporto su gomma italiano.</text>

  <!-- decorative italy map bottom-right -->
  <g transform="translate(870, 145)" opacity="0.92">
    <!-- guide rings -->
    <circle cx="120" cy="170" r="60" fill="none" stroke="#5b21b6" stroke-width="0.8" opacity="0.35"/>
    <circle cx="120" cy="170" r="105" fill="none" stroke="#5b21b6" stroke-width="0.8" opacity="0.2"/>

    <!-- arcs -->
    <path d="M58,40 C 100,80 130,120 120,170" stroke="#5b21b6" stroke-width="1.4" fill="none" opacity="0.85"/>
    <path d="M22,46 C 60,110 150,130 175,200" stroke="#5b21b6" stroke-width="1.4" fill="none" opacity="0.6"/>
    <path d="M135,46 C 180,140 160,230 110,290" stroke="#5b21b6" stroke-width="1.4" fill="none" opacity="0.6"/>
    <path d="M82,68 C 130,108 145,150 142,200" stroke="#5b21b6" stroke-width="1.4" fill="none" opacity="0.7"/>

    <!-- city dots -->
    <circle cx="22"  cy="46"  r="2.2" fill="#1f1810"/>
    <circle cx="58"  cy="40"  r="2.6" fill="#1f1810"/>
    <circle cx="82"  cy="68"  r="2.2" fill="#1f1810"/>
    <circle cx="100" cy="32"  r="1.6" fill="#1f1810"/>
    <circle cx="135" cy="46"  r="2.2" fill="#1f1810"/>
    <circle cx="120" cy="170" r="3.2" fill="#1f1810"/>
    <circle cx="142" cy="200" r="2.2" fill="#1f1810"/>
    <circle cx="175" cy="200" r="2.2" fill="#1f1810"/>
    <circle cx="110" cy="290" r="2.2" fill="#1f1810"/>
    <circle cx="148" cy="296" r="1.8" fill="#1f1810"/>
    <circle cx="56"  cy="252" r="1.6" fill="#1f1810"/>

    <!-- selective labels -->
    <text x="64" y="38" class="mono" font-size="9">MILANO</text>
    <text x="128" y="173" class="mono" font-size="9">ROMA</text>
    <text x="74"  y="291" class="mono" font-size="9">PALERMO</text>
  </g>

  <!-- bottom footer line -->
  <text x="64" y="554" class="mono-accent" font-size="13">FREIGHTER.ONLINE</text>
  <text x="64" y="578" class="sans-2" font-size="14">Il sistema operativo del freight brokerage italiano · Beta privata in arrivo</text>

  <!-- bottom-right tag -->
  <text x="1136" y="554" class="mono" font-size="12" text-anchor="end">LAT./LONG. ROMA · 41°N · 12°E</text>
</svg>
