<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;900&amp;family=Space+Mono:wght@700&amp;display=swap');
    .h    { font-family: 'Archivo', sans-serif; font-weight: 900; fill: #0B0B0B; text-transform: uppercase; }
    .hacc { font-family: 'Archivo', sans-serif; font-weight: 900; fill: #FF4A1C; }
    .brand{ font-family: 'Archivo', sans-serif; font-weight: 900; fill: #0B0B0B; }
    .f    { font-family: 'Archivo', sans-serif; font-weight: 900; fill: #F4F1E7; }
    .mono { font-family: 'Space Mono', monospace; font-weight: 700; fill: #6A665A; letter-spacing: 2px; }
    .monoacc { font-family: 'Space Mono', monospace; font-weight: 700; fill: #FF4A1C; letter-spacing: 2px; }
  </style>

  <rect width="1200" height="630" fill="#F4F1E7"/>
  <rect x="0" y="104" width="1200" height="5" fill="#0B0B0B"/>
  <rect x="0" y="521" width="1200" height="5" fill="#0B0B0B"/>

  <!-- brand lockup top-left -->
  <g transform="translate(64,38)">
    <rect width="40" height="40" fill="#FF4A1C"/>
    <rect x="1.6" y="1.6" width="36.8" height="36.8" fill="none" stroke="#0B0B0B" stroke-width="3"/>
    <text class="f" x="20" y="30" font-size="27" text-anchor="middle">F</text>
    <text class="brand" x="54" y="29" font-size="24" letter-spacing="-1">THE FREIGHTER</text>
  </g>

  <!-- kicker -->
  <g transform="translate(64,166)">
    <rect x="0" y="6" width="26" height="3" fill="#0B0B0B"/>
    <text class="monoacc" x="38" y="13" font-size="14">/01 · COMING SOON</text>
  </g>

  <!-- giant headline (wdth 125, sized to fit 1200) -->
  <text class="h" x="62" y="268" font-size="70" font-stretch="125%" letter-spacing="-2.2" style="font-variation-settings:'wdth' 125;">IL SISTEMA OPERATIVO</text>
  <text x="62" y="345" font-size="70" font-stretch="125%" letter-spacing="-2.2" style="font-variation-settings:'wdth' 125;"><tspan class="h">DEL </tspan><tspan class="hacc">FREIGHT</tspan><tspan class="h"> BROKERAGE</tspan></text>
  <text class="h" x="62" y="422" font-size="70" font-stretch="125%" letter-spacing="-2.2" style="font-variation-settings:'wdth' 125;">ITALIANO.</text>

  <text class="monoacc" x="64" y="572" font-size="15">FREIGHTER.ONLINE</text>
  <text class="mono" x="64" y="596" font-size="13" style="letter-spacing:1px;">TMS · PRICING DATA-DRIVEN · MARKETPLACE VETTORI · BETA PRIVATA</text>
  <text class="mono" x="1136" y="572" font-size="13" text-anchor="end">IT · TRASPORTO SU GOMMA</text>
</svg>
